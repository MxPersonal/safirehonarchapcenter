name: Build and bilingual checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify native locale navigation and admin direction
        run: node scripts/check-language-navigation.mjs
      - name: Verify stable products and moving marquee
        run: node scripts/check-marquee-and-products.mjs
      - name: Static typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

      - name: Verify both languages across public routes
        run: |
          npm run start -- -p 3100 > /tmp/safir-next.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:3100/fa > /dev/null; then break; fi
            sleep 2
          done
          node scripts/verify-i18n.mjs
